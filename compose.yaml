services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/elevate_resume_studio
      UPLOAD_DIR: /data/uploads
    ports:
      - "5000:5000"
    volumes:
      - resume-files:/data/uploads
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
  resume-files:
